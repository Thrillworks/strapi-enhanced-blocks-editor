name: Release

# Publishes @thrillworksinc/strapi-enhanced-blocks-editor to npm when a GitHub Release is published.
#
# Auth is npm Trusted Publishing (OIDC) — there is deliberately NO npm token in this workflow.
# It requires a one-time setup on npmjs.com: the package's Settings → Trusted Publisher, pointing at
# this repo + this workflow file. npm >= 11.5.1 then authenticates via the OIDC token below and
# attaches build provenance automatically.
#
# Do NOT add NODE_AUTH_TOKEN / an _authToken .npmrc — npm would fall back to the legacy token path
# and ignore OIDC. See docs.npmjs.com/trusted-publishers.
#
# Release flow: bump the version, tag it, and publish a GitHub Release → this runs and publishes.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest # ensure npm >= 11.5.1 (OIDC trusted publishing)
      - run: npm ci
      - run: npm run build
      - run: npm publish
